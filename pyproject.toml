[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "togu-gps-processing"
version = "2.7.0"
description = "Modular experimental GPS PPP / PPP-AR processing with EKF and machine learning options"
requires-python = ">=3.10"
dependencies = ["numpy>=1.21", "pandas>=1.4", "openpyxl>=3.0", "scikit-learn>=1.6", "scipy>=1.13"]

[project.scripts]
togu-gps = "gps_processing.cli:main"
togu-gps-gui = "gps_processing.ui.app:main"

[tool.setuptools.packages.find]
include = ["gps_processing*"]
